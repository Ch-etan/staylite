name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# If you push twice quickly, cancel the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repo
permissions:
  contents: read

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # A throwaway Postgres that lives only during this job
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: staylite
          POSTGRES_PASSWORD: staylite
          POSTGRES_DB: staylite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U staylite"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Every "run:" step starts inside backend/
    defaults:
      run:
        working-directory: backend

    # Read by application.yml (the ${DB_URL:...} placeholders)
    env:
      DB_URL: jdbc:postgresql://localhost:5432/staylite
      DB_USER: staylite
      DB_PASSWORD: staylite

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Show tool versions
        run: |
          java -version
          ./mvnw -v

      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
          if-no-files-found: ignore

      - name: Upload built jar
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/target/*.jar
          if-no-files-found: error

  docker:
    name: Build and push Docker image
    needs: backend              # only runs if build and tests passed
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write           # needed to push to GHCR

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # GHCR image names must be lowercase, and your username has capitals
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/staylite-backend" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (push only on main)
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max