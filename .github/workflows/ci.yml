name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# If you push twice quickly, cancel the older run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repo
permissions:
  contents: read

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # A throwaway Postgres that lives only during this job
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: staylite
          POSTGRES_PASSWORD: staylite
          POSTGRES_DB: staylite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U staylite"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Every "run:" step starts inside backend/
    defaults:
      run:
        working-directory: backend

    # Read by application.yml (the ${DB_URL:...} placeholders)
    env:
      DB_URL: jdbc:postgresql://localhost:5432/staylite
      DB_USER: staylite
      DB_PASSWORD: staylite

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Show tool versions
        run: |
          java -version
          ./mvnw -v

      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
          if-no-files-found: ignore

      - name: Upload built jar
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: backend-jar
          path: backend/target/*.jar
          if-no-files-found: error

  docker:
    name: Build and push Docker image
    needs: backend              # only runs if build and tests passed
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write           # needed to push to GHCR

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      # GHCR image names must be lowercase, and your username has capitals
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/staylite-backend" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (push only on main)
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    # Never run two deploys at once, and never cancel one halfway
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Create .env for this release
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          {
            echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}"
            echo "TAG=${GITHUB_SHA}"
            echo "DB_PASSWORD=${DB_PASSWORD}"
          } > .env

      - name: Copy compose file and .env to EC2
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" "mkdir -p ~/staylite"
          scp -i ~/.ssh/deploy_key docker-compose.prod.yml .env "$EC2_USER@$EC2_HOST:~/staylite/"

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" bash -s <<'EOF'
          set -e
          cd ~/staylite
          chmod 600 .env
          docker compose -f docker-compose.prod.yml pull
          docker compose -f docker-compose.prod.yml up -d --remove-orphans
          docker image prune -f
          EOF

      - name: Health check
        run: |
          curl --fail --silent --show-error \
            --retry 12 --retry-delay 10 --retry-all-errors \
            "http://$EC2_HOST/actuator/health"
          echo
          curl --fail --silent --show-error "http://$EC2_HOST/api/listings" | head -c 300

      - name: Show server logs if deploy failed
        if: failure()
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" \
            "cd ~/staylite && docker compose -f docker-compose.prod.yml ps && docker compose -f docker-compose.prod.yml logs --tail 60"