spring:
  application:
    name: staylite-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/staylite}
    username: ${DB_USER:staylite}
    password: ${DB_PASSWORD:staylite}
  jpa:
    hibernate:
      ddl-auto: validate      # Flyway owns the schema, Hibernate only checks it
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    # Must be at least 32 characters. Production gets its own value from JWT_SECRET.
    secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
    ttl-minutes: 120
  # Password given to the seeded demo users (fake data only)
  demo-password: ${DEMO_PASSWORD:demo1234}