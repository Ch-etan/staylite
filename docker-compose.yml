services:
  db:
    image: postgres:16-alpine
    container_name: staylite-db
    environment:
      POSTGRES_USER: staylite
      POSTGRES_PASSWORD: staylite
      POSTGRES_DB: staylite
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staylite"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: staylite-backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/staylite
      DB_USER: staylite
      DB_PASSWORD: staylite
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: