server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the backend container.
    # Using a variable + resolver makes Nginx look the name up per request,
    # so Nginx still starts if the backend isn't ready yet.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Lets the deploy health check reach the backend's health endpoint
    location = /actuator/health {
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:8080;
        proxy_pass $backend;
    }

    # Hashed build files can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: any other path serves index.html (so refreshing /dashboard works)
    location / {
        try_files $uri $uri/ /index.html;
    }
}