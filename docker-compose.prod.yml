services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: staylite
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: staylite
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staylite"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # No "ports:" here. The database is NOT reachable from the internet.

  backend:
    image: ghcr.io/${OWNER}/staylite-backend:${TAG}
    environment:
      DB_URL: jdbc:postgresql://db:5432/staylite
      DB_USER: staylite
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo1234}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # No "ports:" here either. Only Nginx (frontend) can reach it.

  frontend:
    image: ghcr.io/${OWNER}/staylite-frontend:${TAG}
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: